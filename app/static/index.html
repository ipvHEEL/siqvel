<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siqvel Platform</title>
    <style>
      :root {
        --bg: #0a0f1f;
        --card: rgba(255, 255, 255, 0.07);
        --txt: #e9eef7;
        --accent: #7c5cff;
        --ok: #23d18b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--txt);
        background: radial-gradient(circle at top right, #2f1f88, transparent 40%),
          radial-gradient(circle at bottom left, #0a5579, transparent 35%),
          var(--bg);
        min-height: 100vh;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
      h1 { font-size: 36px; margin-bottom: 8px; }
      .subtitle { opacity: .8; margin-bottom: 24px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 16px;
        backdrop-filter: blur(8px);
        padding: 16px;
      }
      input, select, button {
        width: 100%;
        margin-bottom: 10px;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 10px;
        background: rgba(10,15,31,.5);
        color: var(--txt);
        padding: 10px;
      }
      button {
        background: linear-gradient(90deg, var(--accent), #38b6ff);
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .meta { font-size: 12px; opacity: .75; }
      .row { display:flex; gap:8px; }
      .ghost { background: transparent; border:1px solid rgba(255,255,255,.3); }
      .ok { color: var(--ok); font-size: 12px; min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🚀 Siqvel Platform</h1>
      <div class="subtitle">Полный CRUD по Users / Projects / Tasks с поддержкой SQLite, PostgreSQL, MySQL</div>
      <div class="grid">
        <section class="card">
          <h3>Users</h3>
          <input id="u-name" placeholder="Имя" />
          <input id="u-email" placeholder="Email" />
          <button onclick="createUser()">Создать пользователя</button>
          <div id="u-msg" class="ok"></div>
          <ul id="u-list"></ul>
        </section>

        <section class="card">
          <h3>Projects</h3>
          <input id="p-title" placeholder="Название проекта" />
          <input id="p-desc" placeholder="Описание" />
          <input id="p-owner" type="number" placeholder="ID владельца" />
          <button onclick="createProject()">Создать проект</button>
          <div id="p-msg" class="ok"></div>
          <ul id="p-list"></ul>
        </section>

        <section class="card">
          <h3>Tasks</h3>
          <input id="t-title" placeholder="Название задачи" />
          <select id="t-status">
            <option value="todo">todo</option>
            <option value="in_progress">in_progress</option>
            <option value="done">done</option>
          </select>
          <input id="t-project" type="number" placeholder="ID проекта" />
          <button onclick="createTask()">Создать задачу</button>
          <div id="t-msg" class="ok"></div>
          <ul id="t-list"></ul>
        </section>
      </div>
    </div>

    <script>
      const api = '/api';

      async function request(path, options = {}) {
        const res = await fetch(api + path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'Ошибка запроса');
        }
        if (res.status === 204) return null;
        return res.json();
      }

      function row(item, fields, delFn) {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>#${item.id}</strong> ${fields.map(f => item[f]).join(' · ')}
          <div class="row">
            <button class="ghost" onclick="${delFn}(${item.id})">Удалить</button>
          </div>
        `;
        return li;
      }

      async function refreshUsers() {
        const list = document.getElementById('u-list');
        list.innerHTML = '';
        const data = await request('/users');
        data.forEach(u => list.appendChild(row(u, ['name', 'email'], 'deleteUser')));
      }
      async function createUser() {
        try {
          await request('/users', {
            method: 'POST',
            body: JSON.stringify({
              name: document.getElementById('u-name').value,
              email: document.getElementById('u-email').value,
            }),
          });
          document.getElementById('u-msg').textContent = 'Пользователь создан';
          refreshUsers();
        } catch (e) { document.getElementById('u-msg').textContent = e.message; }
      }
      async function deleteUser(id) {
        await request(`/users/${id}`, { method: 'DELETE' });
        refreshUsers();
      }

      async function refreshProjects() {
        const list = document.getElementById('p-list');
        list.innerHTML = '';
        const data = await request('/projects');
        data.forEach(p => list.appendChild(row(p, ['title', 'description', 'owner_id'], 'deleteProject')));
      }
      async function createProject() {
        try {
          await request('/projects', {
            method: 'POST',
            body: JSON.stringify({
              title: document.getElementById('p-title').value,
              description: document.getElementById('p-desc').value,
              owner_id: Number(document.getElementById('p-owner').value),
            }),
          });
          document.getElementById('p-msg').textContent = 'Проект создан';
          refreshProjects();
        } catch (e) { document.getElementById('p-msg').textContent = e.message; }
      }
      async function deleteProject(id) {
        await request(`/projects/${id}`, { method: 'DELETE' });
        refreshProjects();
      }

      async function refreshTasks() {
        const list = document.getElementById('t-list');
        list.innerHTML = '';
        const data = await request('/tasks');
        data.forEach(t => list.appendChild(row(t, ['title', 'status', 'project_id'], 'deleteTask')));
      }
      async function createTask() {
        try {
          await request('/tasks', {
            method: 'POST',
            body: JSON.stringify({
              title: document.getElementById('t-title').value,
              status: document.getElementById('t-status').value,
              project_id: Number(document.getElementById('t-project').value),
            }),
          });
          document.getElementById('t-msg').textContent = 'Задача создана';
          refreshTasks();
        } catch (e) { document.getElementById('t-msg').textContent = e.message; }
      }
      async function deleteTask(id) {
        await request(`/tasks/${id}`, { method: 'DELETE' });
        refreshTasks();
      }

      Promise.all([refreshUsers(), refreshProjects(), refreshTasks()]);
    </script>
  </body>
</html>
