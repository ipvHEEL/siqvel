services:
  db:
    image: postgres:16-alpine
    container_name: siqvel-db
    environment:
      POSTGRES_DB: siqvel
      POSTGRES_USER: siqvel
      POSTGRES_PASSWORD: siqvel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siqvel -d siqvel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: siqvel-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://siqvel:siqvel@db:5432/siqvel
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
